name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-keyring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GnuPG
        run: sudo apt-get update && sudo apt-get install -y gnupg

      # gpg 2.4+ refuses --dry-run --import (exit 2, "keyblock resource
      # pubring.kbx: No such file or directory") when ~/.gnupg does not yet
      # exist — a fresh runner has no .gnupg after apt install. Create it
      # first; verified live: without this the import exits 2, with it it
      # exits 0 and the fingerprint check below passes.
      - name: Ensure ~/.gnupg exists
        run: mkdir -p ~/.gnupg && chmod 700 ~/.gnupg

      - name: Verify shani.gpg imports cleanly
        run: gpg --dry-run --import shani.gpg

      - name: Verify fingerprint matches expected
        run: |
          fingerprint="7B927BFFD4A9EAAA8B666B77DE217F3DA8014792"
          gpg --show-keys shani.gpg | grep -q "$fingerprint" || {
            echo "FAIL: fingerprint $fingerprint not found in shani.gpg"
            exit 1
          }
          echo "OK: fingerprint $fingerprint verified"

  verify-pkgbuild-checksum-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shani-keyring
        uses: actions/checkout@v4
        with:
          path: shani-keyring

      - name: Checkout shani-pkgbuilds
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-pkgbuilds
          path: shani-pkgbuilds

      # shani-pkgbuilds/shani-keyring/PKGBUILD packages this repo's three
      # files verbatim, checksummed - nothing else verifies the two stay in
      # sync, and a drift silently breaks every clean install with a
      # checksum-mismatch error. tests/check-checksums.sh already does this
      # comparison locally (default PKGBUILD path is the sibling checkout
      # this job just set up); this just runs it in CI.
      - name: Verify shani-keyring files match shani-pkgbuilds' PKGBUILD checksums
        working-directory: shani-keyring
        run: ./tests/check-checksums.sh
